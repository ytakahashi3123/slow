[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slow"
description = "Supersonic flow simulation code with low-learning cost"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
  { name = "Yusuke Takahashi", email = "ytakahashi@eng.hokudai.ac.jp" },
]
dependencies = [
  "numpy>=1.22",
  "pyyaml>=6.0",
  "gmsh>=4.9.5",
]
# バージョンは src/slow/__init__.py の __version__ を唯一の情報源とする
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]
# 面ループ・セルループを numba でコンパイルする。無くても動く（遅いだけ）
fast = ["numba>=0.59"]

[project.scripts]
slow = "slow.cli:main"

[tool.setuptools.dynamic]
version = { attr = "slow.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# このコードベースは 2 スペースインデントで、代入の桁揃えと行継続を手で整えている。
# それが読みやすさの一部なので `ruff format` は既存コードには掛けない（linter としてのみ使う）
indent-width = 2
line-length = 200
extend-exclude = ["*pending.py"]

[tool.ruff.lint]
# 既定 (E4,E7,E9,F) に、実バグや取り違えを拾うものだけを足す。
# 体裁を整えるだけの規則は、このコードベースの作法と衝突するので入れない
select = ["E4", "E7", "E9", "F", "B", "PLE"]
ignore = [
  # 関数の先頭で dict から一括展開する定型と、3 次元化のために残している
  # プレースホルダ（wvel, vecz, flux_tmp4 など）を消させないため。
  # 開発者向けメモの「Do not simplify it away」に対応する
  "F841",
  # `except KeyError` などに絞れない箇所が残っているが、意図的に広く捕まえている
  "B904",
]

[tool.pytest.ini_options]
# pip install -e . をしていなくても src/ から import できるようにする
pythonpath = ["src"]
testpaths = ["tests"]
