[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slow"
description = "Supersonic flow simulation code with low-learning cost"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
  { name = "Yusuke Takahashi", email = "ytakahashi@eng.hokudai.ac.jp" },
]
dependencies = [
  "numpy>=1.22",
  "pyyaml>=6.0",
  "gmsh>=4.9.5",
]
# バージョンは src/slow/__init__.py の __version__ を唯一の情報源とする
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
slow = "slow.cli:main"

[tool.setuptools.dynamic]
version = { attr = "slow.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# pip install -e . をしていなくても src/ から import できるようにする
pythonpath = ["src"]
testpaths = ["tests"]
