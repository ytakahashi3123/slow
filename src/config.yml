
computational_setup:
  # Flag for initial or restart calculation
  # --True: initial condition, False: restart
  flag_initial: True

  # Maximum iteraction
  iteration_maximum: 300

  # Governing equations: Navier-Stokes
  flow_model: Navier-Stokes


meshdata_io: 
  filename_mesh: sphere.msh


gas_properties:
  # Specific heat ratio
  gamma: 1.40
  # Universal gas constant (J/K.mol)
  gas_constant_univ: 8.3144598
  # Molecular weight of air (kg/mol)
  molecular_weight: 28.8e-3


initial_settings:
  # Initial conditions 
  # --Input domain name, for example, Fluid
  Fluid:
    # --Density, kg/m^3
    density_initial: 1.e-4
    # --Velocities, m/s
    velocity_initial:
      - 100.0
      - 0.0
      - 0.0
    # Temperature, K
    temperature_initial: 300.0
    # Pressure, Pa <--calculated by EOS
    #pressure_initial: 300.0


boundary_conditions:
  # Boundary conditions
  freestream:
    kind: freestream
    velocity:
      - 600.0
      - 0.0
      - 0.0
    density: 1.e-4
    temperature: 300.0
  
  wall:
    kind: wall
    temperature: 300.0

  outlet:
    kind: outlet


transport_coefficients:
  # Transport coefficients
  #--Viscosity(Sutherland)
  viscosity_sutherland:
    mu0: 1.716e-5
    t0: 273.15
    c: 110.4
  # Prandtl numnber
  prandlt_number: 0.72
  

gradient_setting:
  # Spatial gradient calculation setting
  #-- Gree-Gauss (GG) or Weighten GG (WGG)
  kind_gradient: WGG

  # Flag to use MUSCL
  flag_muscl: True

  # Slope limiter: minmod, none
  kind_limiter: minmod

  # Coefficient for MUSCL (0--1)
  eps_muscl: 1.0


numericalflux_setting:
  advection_scheme: slau2
  

time_integration:
  # Time integration settings

  # Time marching scheme: 
  # --"explicit_euler", "implicit_lusgs"
  kind_time_scheme: implicit_lusgs
  #kind_time_scheme: explicit_euler

  # Time marching
  # --'steady': Steady flow computation, or 'unsteady': Unsteady flow computation
  kind_steady_mode: unsteady

  # Time stepping
  # --'local': Local time stepping, or 'global': Global time stepping
  kind_time_stepping: local
  #kind_time_stepping: global

  # Time step
  # --'cfl': detemined by Courant number, 'dt': by constant time step
  kind_time_determine: cfl

  # Courant number for inner loop in usteady computation
  # valid when kind_time_determine: cfl
  courant_number: 2.5

  # constant timestep (s) for innerr loop in usteady computation
  # valid when kind_time_determine: dt
  timestep_constant: 1.e-6

  # constant timestep (s) for outer loop (when using LUSGS unsteady simulation)
  timestep_outer: 1.e-4

  # Temporal accuracy using LUSGS unsteady simulation
  # --2nd_backward_diff or 1st_backward_diff
  kind_backward_difference: 2nd_backward_diff
  #kind_backward_difference: 1st_backward_diff

  # Maximum inner iteration
  iteration_inner_maximum: 5

  # LUSGS variables
  # 面の寄与にかける過剰緩和係数。対角を大きくして 1 回の掃引を安定させる。
  # **定常計算 (kind_steady_mode: steady) のときだけ効く**（非定常では 0.5 固定）。
  # 定常では内部反復が 1 回に固定されるので、1 回の掃引の質がそのまま解の質になる。
  # kind_lusgs_dissipation: matrix では対角重みが足りなくなることがある（下記参照）
  lusgs_beta: 1.01

  # Dissipation for the LU-SGS implicit operator (non-diagonal blocks)
  # --'scalar': 0.5*(A-lambda*I)*S。lambda=max(lambda_a,lambda_b) のスカラー散逸
  #             安価。既定値（この項目を省略した場合もこちら）
  # --'matrix': 0.5*(A-|A_Roe|)*S。Roe 平均による行列散逸で、
  #             対角もブロック行列になる。内部反復あたりのコストは scalar の
  #             約 1.6 倍だが、内部反復の減衰がノズル格子で 1.4--3.3 倍速くなるため
  #             差し引きで有利。収束後の解は scalar と一致する
  #
  # 【注意】'matrix' を**定常計算**で使うとき、格子と courant_number の組み合わせに
  # よっては残差が下がったあと再上昇する。原因は対角重みの不足なので、
  # **courant_number を下げる**か **lusgs_beta を上げる**かのどちらでも解消する
  # （時間刻みが小さいほど対角の V/dt が大きくなるので、効く向きは同じ）。実測:
  #   chimera 格子 (beta 1.1): CFL 5.0 では反復 78 の 6.2e5 から 2e9 へ再上昇。
  #                 CFL 2.5 なら 168 反復・残差 5.1e1 で収束する。CFL 10/20 は破綻。
  #                 CFL 5.0 のまま beta 2.0 にしても収まる（230 反復、5.9e1）が、
  #                 CFL を下げるほうが結果が良い。beta 4.0 は単調だが遅く、10.0 は過減衰
  #   ノズル格子 (beta 1.1): CFL 2.5 では 82 反復で負の密度・温度・圧力になって停止。
  #                 CFL 1.0 なら 300 反復を単調に完走する（ただしこの格子は scalar でも
  #                 定常では 3e6 程度で停滞する。定常向きの設定ではない）
  #   wedge 格子:   CFL 2.5・beta 1.1 でも単調で、scalar より速い
  #                 （300 反復で 1.5e12 対 2.9e12）
  # 'scalar' は同じ chimera 格子で CFL 20 まで再上昇しない。両者の差は
  # 「許容できる CFL の幅」として現れる、と見るのが実測に合う。
  # 定常で 'matrix' を使うときは残差の履歴 (output_result/history.csv) を見て、
  # 再上昇していたら courant_number を半分にするか lusgs_beta を上げること。
  # なお tutorial のうち定常なのは work_wedge だけで、そこでは 'matrix' が有利。
  #
  # 理由は対角の作り方の差である。'scalar' の対角は 0.5*beta*sum(lambda*S) で、
  # lambda=|u.n|+c+2mu/(rho*d) はすべての固有値の絶対値を過大に見積もるため
  # 余剰の対角重みを持つ。'matrix' の対角は正確な beta*sum(A+ *S) なので、
  # その余剰を beta で補うか、courant_number を下げて時間項 V/dt に補わせる必要がある。
  # 非定常計算では対角が時間項 V/dt に支配され内部反復も複数回あるため影響しない
  kind_lusgs_dissipation: scalar

  # Convergence criterion for inner loop: relative residual or absolute
  # -- relative: True or absolute: False
  flag_convergence_relative_innerloop: True
  criterion_convergence_innerloop: 1.e-8

  # Convergence criteria for outer loop: relative residual or absolute
  # Valid when using steady computation
  # -- relative: True or absolute: False
  flag_convergence_relative_outerloop: True
  criterion_convergence_outerloop: 1.e-8


restart_process:

  # Output directory
  directory_output: output_restart

  # Time series
  # --True: stored individually as time series, False: stored by overwriting
  flag_time_series: False

  # Digid for step
  # --for example, restart_0012.dat will be stored if using digid_step: 4
  digid_step: 4

  # Restart step for reading
  restart_step: 100

  # Restart file name (output)
  file_restart: restart.dat
  # File name for unsteady model
  file_unsteady: unsteady.dat

  # Output frequency
  frequency_output: 1


post_process:
  # Output directory
  directory_output: output_result

  # Time series
  # --True: stored individually as time series, False: stored by overwriting
  flag_time_series: True

  # Digid for step
  # --for example, tecplot_0012.dat will be stored if using digid_step: 4
  digid_step: 4

  # Output (Tecplot)  
  flag_output_tecplot: False
  filename_output_tecplot: tecplot_flowfield.dat

  # Output (VTK)  
  flag_output_vtk: True
  filename_output_vtk: output.vtk

  # Output (residual history, CSV)
  # --ログとは別に、収束の履歴を機械的に扱える形で残す。内部反復ごとに 1 行
  # --項目を省略した場合は出力する (True, history.csv)
  flag_output_history: True
  filename_output_history: history.csv

  # Flat to output initial state (iteration=0)
  flag_output_initial_state: True

  # Output frequency
  frequency_output: 1
